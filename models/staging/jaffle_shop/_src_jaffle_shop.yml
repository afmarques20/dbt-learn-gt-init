sources:
  - name: jaffle_shop
    description: A clone of a Postgres database
    database: raw
    schema: jaffle_shop
    tables: 
      - name: customers
        description: Raw customers data
        columns: 
          - name: id
            description: the primary key
            data_tests: 
              - unique
              - not_null

      - name: orders
        columns:
          - name: id
            data_tests: 
              - unique
              - not_null
        