models:
  - name: stg_stripe__payments
    description: one unique payment per row
    columns:
      - name: payment_id
        description: the primary key
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: foreign key to stg_jaffle_shop__orders
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__orders')
                field: order_id
      - name: payment_method
        description: the payment method used
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
      - name: payment_status
        description: the status of the payment
      - name: amount
        description: the payment amount in dollars
      - name: payment_created_date
        description: timestamp when the payment was created
